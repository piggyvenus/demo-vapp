apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-vapp
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/YOU/demo-vapp.git
    targetRevision: main
    path: vapp
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-vapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
